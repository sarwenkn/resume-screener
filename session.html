<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Resume Ranking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 0;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
    }

    .card h4 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #333;
    }

    .score {
      font-size: 18px;
      font-weight: bold;
      color: #16a34a;
      margin-bottom: 10px;
    }

    .card p {
      margin: 5px 0;
      font-size: 14px;
      color: #555;
    }

    .card span {
      font-size: 14px;
      color: #888;
    }

    .top-candidate {
      border: 2px solid gold;
      background-color: #fffbea;
    }

    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>Shared Resume Ranking</header>

  <div class="container">
    <h2>Role: <span id="role"></span></h2>
    <hr>
    <h3>Ranked Candidates</h3>
    <div id="content">Loading session...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://prgjktvunrqrgfyrycgz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZ2prdHZ1bnJxcmdmeXJ5Y2d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA5NTcwMDYsImV4cCI6MjA3NjUzMzAwNn0.OWjPchFJYb3Viiq1SLu12vzAOdqUzm8JUGbjPlFnPN4";

    async function loadSession() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("id");

      if (!sessionId) {
        document.getElementById("content").innerHTML = "<p class='error'>Invalid link.</p>";
        return;
      }

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/resume_sessions?id=eq.${sessionId}`, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json"
          }
        });

        const data = await response.json();

        if (!data || data.length === 0) {
          document.getElementById("content").innerHTML = "<p class='error'>Session not found or no data available.</p>";
          return;
        }

        const session = data[0];
        // Check if results is already an object
        const results = typeof session.results === 'string' ? JSON.parse(session.results) : session.results;
        const parsedResults = results.map(res => typeof res.output === 'string' ? JSON.parse(res.output) : res.output);

        // Sort candidates by score in descending order
        const sortedResults = parsedResults.sort((a, b) => b.role_fit_score - a.role_fit_score);

        let html = `<div class="grid-container">`;

        sortedResults.forEach((res, index) => {
          const candidateSnapshot = res.candidate_snapshot || {};
          const isTopCandidate = index === 0;

          html += `
            <div class="card ${isTopCandidate ? 'top-candidate' : ''}">
              <h4>#${index + 1} - ${candidateSnapshot.name || "Unknown"} ${isTopCandidate ? '<span>(Top Candidate)</span>' : ''}</h4>
              <div class="score">Score: ${res.role_fit_score || "N/A"}/10</div>
              <p><strong>Experience:</strong> ${candidateSnapshot.years_of_experience || "N/A"} years</p>
              <p><strong>Current Role:</strong> ${candidateSnapshot.current_role || "N/A"}</p>
              <p><strong>Summary:</strong> ${res.professional_summary || "N/A"}</p>
              <p><strong>Strengths:</strong> ${(res.strengths || []).join(", ")}</p>
              <p><strong>Concerns:</strong> ${(res.areas_of_concern || []).join(", ")}</p>
            </div>
          `;
        });

        html += `</div>`;
        document.getElementById("content").innerHTML = html;
        document.getElementById("role").innerText = session.role;
      } catch (error) {
        console.error("Error fetching session data:", error);
        document.getElementById("content").innerHTML = `<p class='error'>Error fetching session data: ${error.message}</p>`;
      }
    }

    loadSession();
  </script>
</body>
</html>
